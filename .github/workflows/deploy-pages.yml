name: Validate and publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/main.js
      - name: Validate website files
        run: python3 scripts/validate.py
      - name: Assemble static output
        run: |
          mkdir -p dist
          cp index.html robots.txt sitemap.xml dist/
          cp -R assets dist/
          touch dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}" --output /tmp/faridh.html && grep -q 'Presisi dalam' /tmp/faridh.html; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then echo 'Published page could not be verified'; exit 1; fi
          for path in assets/style.css assets/main.js assets/images/faridh-portrait.webp assets/images/faridh-moment.webp assets/docs/Faridh-Fikri-CV.pdf robots.txt sitemap.xml; do
            curl --fail --silent --show-error --location --max-time 15 --head "${SITE_URL}${path}" >/dev/null
          done
          echo "Verified live page and 7 assets at ${SITE_URL}"
