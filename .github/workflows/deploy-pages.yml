name: Validate and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/main.js
      - name: Validate website files
        run: python3 scripts/validate.py
      - name: Assemble static output
        run: |
          mkdir -p dist
          cp index.html robots.txt sitemap.xml dist/
          cp -R assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}" --output /tmp/faridh.html && grep -q 'Di antara' /tmp/faridh.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then echo "Deployment content unavailable"; exit 1; fi
            sleep 5
          done
          for file in assets/style.css assets/main.js assets/threshold-world.svg assets/images/faridh-portrait.webp assets/images/faridh-moment.webp assets/docs/Faridh-Fikri-CV.pdf; do
            curl --fail --silent --show-error --location --max-time 20 "${SITE_URL}${file}" -o /dev/null
          done
          echo 'Live portfolio and original assets verified.'
