name: Faridh Surrealist World / Scroll Director QA

on:
  push:
    branches:
      - main
      - experiment/faridh-impasto-full-rebuild
      - experiment/faridh-sculptural-impasto-v2
      - experiment/faridh-surrealist-brutalism-v3
    paths:
      - 'index.html'
      - 'styles.css'
      - 'advance.css'
      - 'world.css'
      - 'scroll-plan.json'
      - 'app.js'
      - 'advance.js'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/reconstruction-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/reconstruction-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Javascript and CV fact invariants
        run: |
          node --check app.js
          node --check advance.js
          node --test tests/portfolio.test.mjs
      - name: Verify Lazarus Scroll Director plan against pinned Design OS revision
        run: |
          git clone -q --depth 1 https://github.com/AzrielChoerulHakim/lazarus-design-os.git /tmp/lazarus-scroll-director
          git -C /tmp/lazarus-scroll-director fetch -q --depth 1 origin 39c41d6528bfdf2005e3a29d2d37e8d0a71a493a
          git -C /tmp/lazarus-scroll-director checkout -q 39c41d6528bfdf2005e3a29d2d37e8d0a71a493a
          node /tmp/lazarus-scroll-director/scripts/scroll-director.mjs check scroll-plan.json --stage decision
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA across seven viewports
        run: node scripts/check-portfolio-browser.mjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faridh-impasto-visual-review
          path: screenshots/faridh-impasto-v2/
          if-no-files-found: warn
