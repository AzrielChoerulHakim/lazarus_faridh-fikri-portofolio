name: Faridh Impasto Full Rebuild — QA

on:
  push:
    branches:
      - experiment/faridh-impasto-full-rebuild
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/reconstruction-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/reconstruction-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Javascript and CV fact invariants
        run: |
          node --check app.js
          node --test tests/portfolio.test.mjs
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA across seven viewports
        run: node scripts/check-portfolio-browser.mjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faridh-impasto-visual-review
          path: screenshots/faridh-impasto/
          if-no-files-found: warn
